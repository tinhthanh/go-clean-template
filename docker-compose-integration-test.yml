services:
  integration-test:
    container_name: integration-test
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    depends_on:
      - app
    environment:
      # The client API's tests seed people and branches straight into the database.
      PG_URL: "postgres://user:myAwEsOm3pa55%40w0rd@db:5432/db"
    networks:
      app_network:
        aliases:
          - test.lvh.me


networks:
  app_network:
    external: false
